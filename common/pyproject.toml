[project]
name = "vts-common"
version = "1.0.0"
description = "Shared library for the Vulnerability Testing System (De 7)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vts_common*"]
